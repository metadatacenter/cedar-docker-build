server {
  listen          4200;
  #server_name    cedar.<cedar.host>;
  root /srv/cedar/cedar-template-editor/app;

  # --- Cache control: prevent stale UI after deploy (added 2026-07-28) ---
  # index.html + config/version.js carry the cache-busting token and are NOT
  # themselves versioned -> never cache them. .html partials and (un-versioned)
  # .css must always revalidate. Versioned (?v=) JS/JSON stay cacheable.
  location = /index.html        { add_header Cache-Control "no-store" always; }
  location = /config/version.js { add_header Cache-Control "no-store" always; }
  location ~* \.(html|css)$     { add_header Cache-Control "no-cache" always; }
  location / {
        try_files $uri /index.html;
  }
  error_log       /log/nginx-error.log warn;
  access_log      /log/nginx-access.log combined;
}