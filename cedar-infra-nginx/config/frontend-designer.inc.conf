upstream cedar-frontend-designer {
        server <cedar.CEDAR_FRONTEND_DESIGNER_HOST>:4202;
}

server {
        listen               80;
        server_name          designer.<cedar.CEDAR_HOST>;
        return               301 https://designer.<cedar.CEDAR_HOST>$request_uri;
}

server {
        listen               443 ssl;
        server_name          designer.<cedar.CEDAR_HOST>;

        include              cedar/inc/ssl-common.conf;

        ssl_certificate     /usr/local/etc/certificates/certs/designer.<cedar.CEDAR_HOST>/designer.<cedar.CEDAR_HOST>.crt;
        ssl_certificate_key /usr/local/etc/certificates/certs/designer.<cedar.CEDAR_HOST>/designer.<cedar.CEDAR_HOST>.key;

        location / {
                proxy_pass   http://cedar-frontend-designer;
        }

        error_log            /etc/nginx/log/nginx-frontend-designer/nginx-error.log warn;
        access_log           /etc/nginx/log/nginx-frontend-designer/nginx-access.log combined if=$loggable;
}
