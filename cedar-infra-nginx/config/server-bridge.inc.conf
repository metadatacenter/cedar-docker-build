upstream cedar-backend-bridge {
        server <cedar.CEDAR_MICROSERVICE_HOST>:9015;
}

server {
        listen               80;
        server_name          bridge.<cedar.CEDAR_HOST>;
        return               301 https://bridge.<cedar.CEDAR_HOST>$request_uri;
}

server {
        listen               443 ssl;
        server_name          bridge.<cedar.CEDAR_HOST>;

        include              cedar/inc/ssl-common.conf;

        ssl_certificate     /usr/local/etc/certificates/certs/bridge.<cedar.CEDAR_HOST>/bridge.<cedar.CEDAR_HOST>.crt;
        ssl_certificate_key /usr/local/etc/certificates/certs/bridge.<cedar.CEDAR_HOST>/bridge.<cedar.CEDAR_HOST>.key;

        location / {
                proxy_pass   http://cedar-backend-bridge;
        }
        # The Swagger UI, served from a checkout the compose stack bind-mounts. The native
        # nginx serves it the same way; without it /api is a 404 and the OpenAPI spec the
        # service advertises at its root has no renderer.
        # CEDAR proxies these to seven third-party registries, and three of them are called with
        # credentials the deployment holds. The routes take none of their own, because the embeddable
        # editor calls them from a browser that has none to give and no place to keep one.
        #
        # Rate limiting rather than authentication is what bounds the abuse: a key shipped to a browser
        # application is not a secret, so requiring one would stop nobody who wanted to relay through
        # here, while breaking every host that embeds the editor. 10r/s with a burst of 20 is well above
        # a person typing into a lookup field and well below a useful relay.
        location /ext-auth/ {
                limit_req        zone=cedar_ext_auth burst=20 nodelay;
                limit_req_status 429;
                proxy_pass       http://cedar-backend-bridge;
        }
        location /api {
                alias        /usr/local/etc/swagger-ui;
        }

        error_page           502 /errors/502.json;
        location             ^~ /errors/ {
                internal;
                root         /etc/nginx/cedar/static/;
        }

        error_log            /etc/nginx/log/nginx-bridge/nginx-error.log warn;
        access_log           /etc/nginx/log/nginx-bridge/nginx-access.log combined if=$loggable;
}
